[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breakdown-graph"
description = "Flat markdown typed-link topology with git solutions and one work area"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
dynamic = ["version"]
keywords = ["markdown", "knowledge-graph", "topology", "documentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/jkCXf9X4/breakdown_graph"
Repository = "https://github.com/jkCXf9X4/breakdown_graph"

[project.scripts]
bdg = "bdg.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bdg.__version__"}
