[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "breakdown-tree"
description = "Flat markdown typed-link topology with git solutions and one work area"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
dynamic = ["version"]
keywords = ["markdown", "knowledge-graph", "topology", "documentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
]

[project.scripts]
bd = "bd_tree.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bd_tree.__version__"}
